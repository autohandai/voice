name: Nightly Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish nightly DMG
    runs-on: macos-15
    timeout-minutes: 60

    env:
      AUTOHAND_VOICE_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Run Swift tests
        run: swift test

      - name: Build release executables
        run: swift build -c release

      - name: Verify local-only system contract
        run: ./.build/release/autohand-voice check --json

      - name: Import stable signing identity
        # Optional. Without it the build is ad-hoc signed, and every update
        # looks like a new app to macOS (Keychain password prompts, and
        # Accessibility and login items need approving again).
        env:
          SIGNING_P12_BASE64: ${{ secrets.AUTOHAND_VOICE_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.AUTOHAND_VOICE_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12_BASE64" ]; then
            echo "No stable signing identity configured; using ad-hoc signing."
            exit 0
          fi
          keychain="$RUNNER_TEMP/autohand-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12="$RUNNER_TEMP/autohand-signing.p12"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          identity="$(security find-certificate -a -Z -c "Autohand Voice" "$keychain" | awk '/SHA-1 hash:/ {print $3; exit}')"
          test -n "$identity"
          echo "AUTOHAND_VOICE_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "AUTOHAND_VOICE_CODESIGN_SELF_SIGNED=1" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Build installable disk image
        env:
          AUTOHAND_VOICE_SKIP_APP_BUILD: "1"
        run: ./scripts/build-installer.sh

      - name: Verify app signature and architecture
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/Autohand Voice.app"
          test "$(lipo -archs "dist/Autohand Voice.app/Contents/MacOS/autohand-voice")" = "x86_64 arm64"
          test "$(lipo -archs "dist/Autohand Voice.app/Contents/MacOS/autohand-voice-stt")" = "x86_64 arm64"

      - name: Compute checksum
        run: |
          (
            cd dist
            dmg="$(find . -maxdepth 1 -name '*.dmg' -print -quit)"
            test -n "$dmg"
            shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256"
          )

      - name: Publish nightly build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nightlybuild-latest"
          dmg_path="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          sha_path="${dmg_path}.sha256"
          test -f "$sha_path"
          notes_file="$(mktemp)"
          {
            printf '%s\n\n' "This is a **nightly build**, rebuilt automatically from \`main\` on every push. It is ad-hoc signed, not notarized by Apple, so Gatekeeper will warn when you open it. To run it, right-click the DMG and choose **Open**, or remove the quarantine attribute with:"
            printf '```\n'
            printf 'xattr -dr com.apple.quarantine "%s"\n' "$(basename "$dmg_path")"
            printf '```\n'
            printf '\nFor a stable, versioned release, see the [latest release](https://github.com/%s/releases/latest) instead.\n' "$GITHUB_REPOSITORY"
          } > "$notes_file"

          # Roll the build forward: delete any prior nightlybuild-latest (and
          # its tag) so the new one always has exactly this run's DMG
          # attached, then recreate it fresh. `gh release edit` has no
          # `--force` flag, so it cannot update an existing release in place.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi

          gh release create "$tag" \
            "$dmg_path" \
            "$sha_path" \
            dist/THIRD-PARTY-NOTICES.txt \
            --title "Autohand Voice — Nightly Build (latest)" \
            --notes-file "$notes_file" \
            --prerelease
